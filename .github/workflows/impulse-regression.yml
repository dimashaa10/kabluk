name: Server impulse regression tests

on:
  push:
    paths:
      - 'Quake/**'
      - 'tests/**'
      - '.github/workflows/impulse-regression.yml'
  pull_request:
    paths:
      - 'Quake/**'
      - 'tests/**'
      - '.github/workflows/impulse-regression.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cigarette and cheat impulse routing
        run: ./tests/run_cigarette_impulse_tests.sh
